<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Visualizador de Móveis - Touch Pro</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #000; user-select: none; }
        
        #webcam {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #zona-touch {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 999; /* Fica por cima de tudo para capturar os dedos */
        }
        
        .instrucao {
            position: fixed; top: 20px; width: 100%; text-align: center;
            color: white; text-shadow: 1px 1px 4px black; font-size: 14px;
            z-index: 1000; pointer-events: none;
            background: rgba(0,0,0,0.4); padding: 8px 0;
        }
    </style>

    <script>
        // Corretor de cor do KIRI Engine (Ativo e fixado)
        AFRAME.registerComponent('corrigir-cor', {
          init: function () {
            this.el.addEventListener('model-loaded', () => {
              const mesh = this.el.getObject3D('mesh');
              if (mesh) {
                mesh.traverse((node) => {
                  if (node.isMesh) {
                    node.material.roughness = 1;
                    node.material.metalness = 0;
                    if (node.material.map) node.material.map.encoding = THREE.sRGBEncoding;
                    node.material.needsUpdate = true;
                  }
                });
              }
            });
          }
        });
    </script>
</head>
<body>

    <div class="instrucao">
        👆 1 Dedo: Mover p/ lados e frente | ✌️ 2 Dedos: Girar e ajustar altura
    </div>

    <video id="webcam" autoplay playsinline></video>

    <div id="zona-touch"></div>

    <a-scene embedded vr-mode-ui="enabled: false">
        <a-entity light="type: ambient; intensity: 1.8;"></a-entity>
        <a-entity light="type: directional; intensity: 1.5; position: 1 4 3;"></a-entity>
        
        <a-camera position="0 1.6 0" look-controls="enabled: false"></a-camera>

        <a-entity position="0 -0.4 -2.2" rotation="-90 0 0" id="target">
            <a-gltf-model 
                src="https://raw.githubusercontent.com/Anonimo5/meu-webar/main/model.glb" 
                scale="1 1 1"
                corrigir-cor>
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        // Liga a câmera traseira do celular
        const video = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false })
        .then(stream => { video.srcObject = stream; })
        .catch(err => {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(stream => { video.srcObject = stream; });
        });

        // Lógica Avançada de Toque (Touch)
        const el = document.getElementById('target');
        const zonaTouch = document.getElementById('zona-touch');
        
        let tpAnterior = []; // Guarda a posição dos dedos no frame anterior
        let distInicialPinca = 0;

        zonaTouch.addEventListener('touchstart', (e) => {
            tpAnterior = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
            if (e.touches.length === 2) {
                // Calcula a distância inicial entre os dois dedos para a pinça
                distInicialPinca = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, { passive: true });

        zonaTouch.addEventListener('touchmove', (e) => {
            if (!tpAnterior.length) return;

            // CONTROLE COM 1 DEDO: Mover o objeto pelo espaço (Ajuste Fino)
            if (e.touches.length === 1) {
                const toque = e.touches[0];
                const deltaX = toque.clientX - tpAnterior[0].x;
                const deltaY = toque.clientY - tpAnterior[0].y;

                // Move milimetricamente com base no arrasto do dedo
                el.object3D.position.x += deltaX * 0.003; 
                el.object3D.position.z += deltaY * 0.005; 

                tpAnterior[0] = { x: toque.clientX, y: toque.clientY };
            } 
            
            // CONTROLE COM 2 DEDOS: Girar (Y) e Altura (Subir/Descer)
            else if (e.touches.length === 2) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                
                // 1. Cálculo de Rotação (Girar os dedos como uma chave)
                const dxAtual = t1.clientX - t2.clientX;
                const dyAtual = t1.clientY - t2.clientY;
                const dxAnterior = tpAnterior[0].x - tpAnterior[1].x;
                const dyAnterior = tpAnterior[0].y - tpAnterior[1].y;
                
                const anguloAtual = Math.atan2(dyAtual, dxAtual);
                const anguloAnterior = Math.atan2(dyAnterior, dxAnterior);
                let deltaAngulo = anguloAtual - anguloAnterior;
                
                el.object3D.rotation.y -= deltaAngulo * 1.2; // Gira o móvel suavemente

                // 2. Cálculo de Pinça (Aproximar/Afastar os dedos para Subir/Descer Altura)
                const distAtualPinca = Math.hypot(dxAtual, dyAtual);
                const deltaPinca = distAtualPinca - distInicialPinca;
                
                el.object3D.position.y += deltaPinca * 0.002; // Sobe ou desce a mesa de forma fina

                distInicialPinca = distAtualPinca;
                tpAnterior[0] = { x: t1.clientX, y: t1.clientY };
                tpAnterior[1] = { x: t2.clientX, y: t2.clientY };
            }
        }, { passive: true });

        zonaTouch.addEventListener('touchend', () => { tpAnterior = []; });
    </script>
</body>
</html>
