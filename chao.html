<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Móveis - Sem Marcador Seguro</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #000; }
        
        /* Força a câmera nativa a ocupar o fundo da tela inteira */
        #webcam {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* O motor 3D fica flutuando transparente por cima do vídeo */
        a-scene {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }
        
        .painel-controles {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px; border-radius: 12px; width: 90%; max-width: 380px;
        }
        .btn-controle {
            background: #007bff; color: white; border: none; padding: 12px;
            border-radius: 6px; font-size: 13px; font-weight: bold;
            flex: 1 1 40%; min-width: 90px;
        }
        .btn-controle:active { background: #0056b3; }
        .instrucao {
            position: fixed; top: 15px; width: 100%; text-align: center;
            color: white; text-shadow: 1px 1px 4px black; font-size: 14px;
            z-index: 999; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="instrucao">Ajuste o móvel no seu chão usando os botões abaixo</div>

    <video id="webcam" autoplay playsinline></video>

    <div class="painel-controles">
        <button class="btn-controle" id="giro-esq">🔄 Girar Esq.</button>
        <button class="btn-controle" id="giro-dir">🔄 Girar Dir.</button>
        <button class="btn-controle" id="mais-longe">⬆️ Afastar</button>
        <button class="btn-controle" id="mais-perto">⬇️ Aproximar</button>
        <button class="btn-controle" id="subir" style="background-color: #28a745;">🟩 Subir</button>
        <button class="btn-controle" id="descer" style="background-color: #dc3545;">🟥 Descer</button>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false">
        <a-entity light="type: ambient; intensity: 1.6;"></a-entity>
        <a-entity light="type: directional; intensity: 1.3; position: 1 4 2;"></a-entity>
        
        <a-camera position="0 1.6 0" look-controls="enabled: false"></a-camera>

        <a-entity position="0 -0.5 -2.5" rotation="-90 0 0" id="target">
            <a-gltf-model 
                src="https://raw.githubusercontent.com/Anonimo5/meu-webar/main/model.glb" 
                scale="1 1 1"
                corrigir-cor>
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        // Script simples para abrir a câmera traseira do celular
        const video = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { exact: "environment" } }, 
            audio: false 
        })
        .then(stream => { video.srcObject = stream; })
        .catch(err => {
            // Se falhar (ex: no PC que não tem câmera traseira), tenta qualquer câmera disponível
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => { video.srcObject = stream; });
        });

        // Configuração dos Botões de Ajuste Manual
        const el = document.getElementById('target');
        document.getElementById('giro-esq').addEventListener('click', () => { el.object3D.rotation.y += 0.2; });
        document.getElementById('giro-dir').addEventListener('click', () => { el.object3D.rotation.y -= 0.2; });
        document.getElementById('mais-longe').addEventListener('click', () => { el.object3D.position.z -= 0.2; });
        document.getElementById('mais-perto').addEventListener('click', () => { el.object3D.position.z += 0.2; });
        document.getElementById('subir').addEventListener('click', () => { el.object3D.position.y += 0.1; });
        document.getElementById('descer').addEventListener('click', () => { el.object3D.position.y -= 0.1; });

        // Ajuste de cores do KIRI
        AFRAME.registerComponent('corrigir-cor', {
          init: function () {
            this.el.addEventListener('model-loaded', () => {
              const mesh = this.el.getObject3D('mesh');
              mesh.traverse((node) => {
                if (node.isMesh) {
                  node.material.roughness = 1;
                  node.material.metalness = 0;
                  if (node.material.map) node.material.map.encoding = THREE.sRGBEncoding;
                  node.material.needsUpdate = true;
                }
              });
            });
          }
        });
    </script>
</body>
</html>
