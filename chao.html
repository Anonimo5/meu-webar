<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Visualizador Móveis - Controle Total</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #000; user-select: none; }
        #webcam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .instrucao { 
            position: fixed; top: 20px; width: 100%; text-align: center; 
            color: white; text-shadow: 1px 1px 4px black; font-size: 13px; 
            z-index: 1000; pointer-events: none; background: rgba(0,0,0,0.6); padding: 8px 0; 
        }
    </style>

    <script>
        // Garante as cores sRGB corretas e ativa a projeção de sombras no móvel
        AFRAME.registerComponent('configurar-objeto', {
          init: function () {
            this.el.addEventListener('model-loaded', () => {
              const mesh = this.el.getObject3D('mesh');
              if (mesh) {
                mesh.traverse((node) => {
                  if (node.isMesh) {
                    node.material.roughness = 0.8;
                    node.material.metalness = 0.1;
                    if (node.material.map) node.material.map.encoding = THREE.sRGBEncoding;
                    node.castShadow = true;
                    node.receiveShadow = true;
                    node.material.needsUpdate = true;
                  }
                });
              }
            });
          }
        });
    </script>
</head>
<body>

    <div class="instrucao">
        👆 1 Dedo: Mover Móvel | ✌️ 2 Dedos: Girar Móvel
    </div>

    <video id="webcam" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" shadow="type: pcfsoft" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;">
        
        <a-assets>
            <a-asset-item id="modelo-moveu" src="https://raw.githubusercontent.com/Anonimo5/meu-webar/main/model.glb?v=3"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
        <a-entity light="type: directional; intensity: 1.1; castShadow: true; shadowMapHeight: 1024; shadowMapWidth: 1024; shadowCameraTop: 2; shadowCameraBottom: -2; shadowCameraLeft: -2; shadowCameraRight: 2;" position="0.2 4 0.2"></a-entity>
        
        <a-camera position="0 1.6 0" look-controls="enabled: false"></a-camera>

        <a-entity position="0 0.1 -1.8" rotation="0 0 0" id="target">
            
            <a-gltf-model 
                src="#modelo-moveu" 
                scale="1 1 1"
                configurar-objeto>
            </a-gltf-model>

            <a-mesh rotation="-90 0 0" position="0 -0.01 0" shadow="receive: true">
                <a-plane width="4" height="4"></a-plane>
                <a-shadow-material></a-shadow-material>
            </a-mesh>
            
        </a-entity>

    </a-scene>

    <script>
        // Inicialização da câmera traseira
        const video = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(stream => { video.srcObject = stream; }); });

        // CONTROLES TACTEIS AVANÇADOS
        const el = document.getElementById('target');
        let tpAnterior = [];

        window.addEventListener('touchstart', (e) => {
            tpAnterior = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!tpAnterior.length) return;

            // 1 DEDO: Move o objeto livremente nos eixos X e Z (para os lados, para frente e para trás)
            if (e.touches.length === 1) {
                const toque = e.touches[0];
                const deltaX = toque.clientX - tpAnterior[0].x;
                const deltaY = toque.clientY - tpAnterior[0].y;

                // Move de acordo com o arrastar do dedo
                el.object3D.position.x += deltaX * 0.005; 
                el.object3D.position.z += deltaY * 0.007; 

                tpAnterior[0] = { x: toque.clientX, y: toque.clientY };
            } 
            // 2 DEDOS: Gira o objeto no próprio eixo de forma suave
            else if (e.touches.length === 2) {
                const t1 = e.touches[0]; const t2 = e.touches[1];
                const dxAtual = t1.clientX - t2.clientX; const dyAtual = t1.clientY - t2.clientY;
                
                const anguloAtual = Math.atan2(dyAtual, dxAtual);
                const anguloAnterior = Math.atan2(tpAnterior[0].y - tpAnterior[1].y, tpAnterior[0].x - tpAnterior[1].x);
                
                el.object3D.rotation.y -= (anguloAtual - anguloAnterior) * 1.5;

                tpAnterior[0] = { x: t1.clientX, y: t1.clientY }; 
                tpAnterior[1] = { x: t2.clientX, y: t2.clientY };
            }
        }, { passive: true });

        window.addEventListener('touchend', () => { tpAnterior = []; });
    </script>
</body>
</html>
