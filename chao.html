<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Teste Direto Sem Erros</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #000; user-select: none; }
        #webcam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .instrucao { 
            position: fixed; top: 20px; width: 100%; text-align: center; 
            color: white; text-shadow: 1px 1px 4px black; font-size: 14px; 
            z-index: 1000; pointer-events: none; background: rgba(0,0,0,0.6); padding: 10px 0; 
        }
    </style>

    <script>
        AFRAME.registerComponent('configurar-objeto', {
          init: function () {
            this.el.addEventListener('model-loaded', () => {
              console.log("MÓVEL CARREGOU COM SUCESSO NO NAVEGADOR!");
              const mesh = this.el.getObject3D('mesh');
              if (mesh) {
                mesh.traverse((node) => {
                  if (node.isMesh) {
                    node.material.roughness = 0.8;
                    node.material.metalness = 0.1;
                    if (node.material.map) node.material.map.encoding = THREE.sRGBEncoding;
                    node.castShadow = true;
                    node.receiveShadow = true;
                    node.material.needsUpdate = true;
                  }
                });
              }
            });
            this.el.addEventListener('model-error', (e) => {
              console.error("ERRO AO BAIXAR O GLB DO GITHUB:", e);
            });
          }
        });
    </script>
</head>
<body>

    <div class="instrucao">
        TESTE FORÇADO: O vaso deve aparecer fixo na sua frente em 5 segundos!
    </div>

    <video id="webcam" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" shadow="type: pcfsoft" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;">
        
        <a-assets>
            <a-asset-item id="modelo-moveu" src="https://raw.githubusercontent.com/Anonimo5/meu-webar/main/model.glb?v=2"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 1.6;"></a-entity>
        <a-entity light="type: directional; intensity: 1.3; castShadow: true;" position="1 4 1"></a-entity>
        
        <a-camera position="0 1.6 0" look-controls="enabled: false"></a-camera>

        <a-entity position="0 0.2 -2.0" rotation="0 0 0" id="target">
            <a-gltf-model 
                src="#modelo-moveu" 
                scale="1 1 1"
                configurar-objeto>
            </a-gltf-model>

            <a-plane position="0 -0.01 0" rotation="-90 0 0" width="3" height="3" shadow="receive: true" material="shadowOnly: true; opacity: 0.6;"></a-plane>
        </a-entity>

    </a-scene>

    <script>
        // Inicialização da câmera traseira
        const video = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(stream => { video.srcObject = stream; }); });

        // ROTAÇÃO DE 1 DEDO DIRETO NA TELA PARA TESTAR SE ELE GIRA
        const el = document.getElementById('target');
        let xAnterior = 0;
        let dynamicTouch = false;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                xAnterior = e.touches[0].clientX;
                dynamicTouch = true;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!dynamicTouch || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - xAnterior;
            el.object3D.rotation.y += deltaX * 0.01;
            xAnterior = e.touches[0].clientX;
        }, { passive: true });

        window.addEventListener('touchend', () => { dynamicTouch = false; });
    </script>
</body>
</html>
