<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Minha Mesa Real Corrigida</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
      AFRAME.registerComponent('corrigir-cor', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            mesh.traverse((node) => {
              if (node.isMesh) {
                // Força o material a aceitar a luz comum do site e tira o "preto"
                node.material.roughness = 1;
                node.material.metalness = 0;
                if (node.material.map) node.material.map.encoding = THREE.sRGBEncoding;
                node.material.needsUpdate = true;
              }
            });
          });
        }
      });
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true;" vr-mode-ui="enabled: false">
      
      <a-entity light="type: ambient; intensity: 1.8;"></a-entity>
      <a-entity light="type: directional; intensity: 1.5; position: 1 4 3;"></a-entity>
      
      <a-marker preset="hiro">
        <a-gltf-model 
          src="https://raw.githubusercontent.com/Anonimo5/meu-webar/main/model.glb" 
          scale="1 1 1" 
          position="0 0 0"
          rotation="-90 0 0"
          corrigir-cor>
        </a-gltf-model>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
